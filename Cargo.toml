[package]
name = "llm-multiaccount-proxy"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "One Anthropic-compatible endpoint for LLM accounts you control"
repository = "https://github.com/TriformAI/llm-multiaccount-proxy"
homepage = "https://github.com/TriformAI/llm-multiaccount-proxy"
readme = "README.md"
keywords = ["anthropic", "proxy", "llm", "claude"]
categories = ["network-programming", "web-programming"]

[lib]
name = "llmap"
path = "src/lib.rs"

[[bin]]
name = "llmap"
path = "src/main.rs"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.88"
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["http2", "json"] }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde", "std"] }
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.37", features = ["derive"] }
crc32fast = "1.4.2"
futures-util = "0.3.31"
hmac = "0.12.1"
http-body-util = "0.1.3"
hudsucker = { version = "0.24.0", default-features = false, features = ["http2", "rcgen-ca", "rustls-client"] }
parking_lot = "0.12.3"
rand = "0.8.5"
reqwest = { version = "0.12.15", default-features = false, features = ["http2", "json", "rustls-tls", "socks", "stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.12"
# RUSTSEC-2026-0009 is fixed in 0.3.47; that release requires Rust 1.88.
time = "=0.3.47"
toml = "0.8.22"
tokio = { version = "1.44.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5.4", features = ["serde"] }
zeroize = "1.8.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.19.1"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
strip = "symbols"
