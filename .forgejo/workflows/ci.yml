name: ci

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: docker
    container:
      image: rust:1.85-bookworm
    steps:
      - name: Prepare checkout runtime
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs pkg-config
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Preserve resolved dependency lock
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
